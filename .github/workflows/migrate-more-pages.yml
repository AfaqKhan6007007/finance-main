name: Migrate additional pages and add API client

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update'
        default: 'react-migration-cra-ts'
        required: true
        type: string
      include_dashboard:
        description: 'Create a Dashboard page'
        default: true
        required: true
        type: boolean
      include_login:
        description: 'Create a Login page'
        default: true
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  pages-api-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Create additional pages and API client
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src/pages src/api

          # Dashboard page (optional)
          if [ "${{ github.event.inputs.include_dashboard }}" = "true" ]; then
            cat > src/pages/Dashboard.tsx <<'TSX'
            import React from 'react';

            export default function Dashboard() {
              return (
                <main style={{ padding: '1rem' }}>
                  <h1>Dashboard</h1>
                  <p>Overview of key metrics.</p>
                </main>
              );
            }
            TSX
          fi

          # Login page (optional)
          if [ "${{ github.event.inputs.include_login }}" = "true" ]; then
            cat > src/pages/Login.tsx <<'TSX'
            import React, { useState } from 'react';

            export default function Login() {
              const [email, setEmail] = useState('');
              const [password, setPassword] = useState('');
              const onSubmit = (e: React.FormEvent) => {
                e.preventDefault();
                // TODO: wire up real auth call
                alert(`Logging in as ${email}`);
              };

              return (
                <main style={{ padding: '1rem' }}>
                  <h1>Login</h1>
                  <form onSubmit={onSubmit} style={{ display: 'grid', gap: '0.5rem', maxWidth: 320 }}>
                    <label>
                      Email
                      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
                    </label>
                    <label>
                      Password
                      <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
                    </label>
                    <button type="submit">Sign in</button>
                  </form>
                </main>
              );
            }
            TSX
          fi

          # API client
          cat > src/api/client.ts <<'TS'
          export const API_BASE = process.env.REACT_APP_API_BASE_URL || '';

          export async function apiGet<T>(path: string): Promise<T> {
            const res = await fetch(`${API_BASE}${path}`, {
              method: 'GET',
              headers: { 'Content-Type': 'application/json' },
            });
            if (!res.ok) throw new Error(`GET ${path} failed: ${res.status}`);
            return res.json() as Promise<T>;
          }

          export async function apiPost<T>(path: string, body: unknown): Promise<T> {
            const res = await fetch(`${API_BASE}${path}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) throw new Error(`POST ${path} failed: ${res.status}`);
            return res.json() as Promise<T>;
          }
          TS

          # Update routes to include new pages if they exist
          cat > src/routes/index.tsx <<'TSX'
          import React from 'react';
          import Home from '../pages/Home';
          import Dashboard from '../pages/Dashboard';
          import Login from '../pages/Login';

          export type AppRoute = { path: string; element: React.ReactElement };

          export const routes: AppRoute[] = [
            { path: '/', element: <Home /> },
            // The following routes will work if the files exist; otherwise TypeScript may warn until they’re added.
            { path: '/dashboard', element: <Dashboard /> },
            { path: '/login', element: <Login /> },
          ];
          TSX

          # Update App.tsx nav links
          cat > src/App.tsx <<'TSX'
          import React from 'react';
          import { BrowserRouter, Routes, Route, Link } from 'react-router-dom';
          import { routes } from './routes';

          export default function App() {
            const links = [
              { to: '/', label: 'Home' },
              { to: '/dashboard', label: 'Dashboard' },
              { to: '/login', label: 'Login' },
            ];

            return (
              <BrowserRouter>
                <nav style={{ padding: '0.5rem', display: 'flex', gap: '0.75rem' }}>
                  {links.map((l) => (
                    <Link key={l.to} to={l.to}>{l.label}</Link>
                  ))}
                </nav>
                <Routes>
                  {routes.map((r) => (
                    <Route key={r.path} path={r.path} element={r.element} />
                  ))}
                </Routes>
              </BrowserRouter>
            );
          }
          TSX

          # Prevent committing foreign workflows
          if [ -d ".github/workflows" ]; then
            find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) \
              ! -name "unzip-finance-archive.yml" \
              ! -name "scaffold-cra.yml" \
              ! -name "migrate-routing.yml" \
              ! -name "migrate-pages.yml" \
              ! -name "migrate-more-pages.yml" -exec rm -f {} +
          fi

      - name: Commit changes
        run: |
          set -euxo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git restore --staged --worktree -- .github/workflows || true
          for wf in unzip-finance-archive.yml scaffold-cra.yml migrate-routing.yml migrate-pages.yml migrate-more-pages.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              git add ".github/workflows/$wf"
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit." && exit 0
          fi
          git commit -m "Migrate additional pages (Dashboard, Login) and add API client"

      - name: Push changes
        run: |
          set -euxo pipefail
          git push origin "${{ github.event.inputs.target_branch }}"
