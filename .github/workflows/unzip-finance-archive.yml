name: Unzip finance-main.zip into repo root

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Relative path to zip file'
        default: 'finance-main.zip'
        required: true
        type: string
      target_branch:
        description: 'Branch to unzip and commit to'
        default: 'react-migration-cra-ts'
        required: true
        type: string

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Install tools (unzip, rsync)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Unzip archive and merge into root
        run: |
          set -euxo pipefail
          ARCHIVE_PATH="${{ github.event.inputs.path }}"
          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "Archive not found: $ARCHIVE_PATH" >&2
            exit 1
          fi

          TMP_DIR=$(mktemp -d)
          unzip -q "$ARCHIVE_PATH" -d "$TMP_DIR"

          shopt -s dotglob nullglob
          TOPS=("$TMP_DIR"/*)

          copy_merge() {
            SRC="$1"
            for ITEM in "$SRC"/*; do
              [ -e "$ITEM" ] || continue
              NAME="$(basename "$ITEM")"

              # Skip git internals
              if [ "$NAME" = ".git" ]; then
                continue
              fi

              if [ -d "$ITEM" ]; then
                mkdir -p "./$NAME"
                rsync -a --exclude=".git" "$ITEM"/ "./$NAME"/
              else
                cp -f "$ITEM" "./$NAME"
              fi
            done
          }

          if [ ${#TOPS[@]} -eq 1 ] && [ -d "${TOPS[0]}" ]; then
            copy_merge "${TOPS[0]}"
          else
            copy_merge "$TMP_DIR"
          fi

          rm -rf "$TMP_DIR"

      - name: Remove workflow files from zip to avoid permission errors
        run: |
          set -euxo pipefail
          if [ -d ".github/workflows" ]; then
            # Remove any workflows brought by the zip except our unzip workflow
            find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) \
              ! -name "unzip-finance-archive.yml" -exec rm -f {} +
          fi

      - name: Optionally remove the zip
        run: |
          set -euxo pipefail
          rm -f "${{ github.event.inputs.path }}" || true

      - name: Commit changes
        run: |
          set -euxo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          # Unstage any workflow files except our unzip workflow
          git restore --staged --worktree -- .github/workflows || true
          if [ -f ".github/workflows/unzip-finance-archive.yml" ]; then
            git add .github/workflows/unzip-finance-archive.yml
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit." && exit 0
          fi

          git commit -m "Unzip finance-main.zip into repo root (excluding workflows from zip)"

      - name: Push changes
        run: |
          set -euxo pipefail
          git push origin "${{ github.event.inputs.target_branch }}"
