name: Unzip finance-main.zip into repo root

on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Relative path to zip file'
        default: 'finance-main.zip'
        required: true
        type: string
      target_branch:
        description: 'Branch to unzip and commit to'
        default: 'react-migration-cra-ts'
        required: true
        type: string

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Ensure unzip is available
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip archive and merge into root
        run: |
          set -euxo pipefail
          ARCHIVE_PATH="${{ github.event.inputs.path }}"
          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "Archive not found: $ARCHIVE_PATH" >&2
            exit 1
          fi
          TMP_DIR=$(mktemp -d)
          unzip -q "$ARCHIVE_PATH" -d "$TMP_DIR"

          shopt -s dotglob nullglob
          TOPS=("$TMP_DIR"/*)

          # Function to copy/merge contents respecting existing directories
          copy_merge() {
            SRC="$1"
            for ITEM in "$SRC"/*; do
              [ -e "$ITEM" ] || continue
              NAME="$(basename "$ITEM")"

              # Skip git internals if they exist in the zip
              if [ "$NAME" = ".git" ]; then
                continue
              fi

              if [ -d "$ITEM" ]; then
                mkdir -p "./$NAME"
                # Use rsync if available for robust merging; fallback to cp
                if command -v rsync >/dev/null 2>&1; then
                  rsync -a --delete --exclude=".git" "$ITEM"/ "./$NAME"/
                else
                  cp -R "$ITEM"/ "./$NAME"/ || true
                fi
              else
                # Overwrite files in root if they exist
                cp -f "$ITEM" "./$NAME"
              fi
            done
          }

          # If the zip contains a single top-level folder, flatten it; otherwise merge all
          if [ ${#TOPS[@]} -eq 1 ] && [ -d "${TOPS[0]}" ]; then
            copy_merge "${TOPS[0]}"
          else
            copy_merge "$TMP_DIR"
          fi

          rm -rf "$TMP_DIR"

      - name: Remove the zip archive (optional)
        run: rm -f finance-main.zip || true

      - name: Commit changes
        run: |
          set -euxo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit." && exit 0
          fi
          git commit -m "Unzip finance-main.zip into repo root"

      - name: Push changes
        run: git push origin ${{ github.event.inputs.target_branch }}
