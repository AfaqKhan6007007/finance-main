name: Ensure CRA build succeeds

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build'
        default: 'react-migration-cra-ts'
        required: true
        type: string

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Pin TypeScript 4.9.5 and ensure react-scripts 5.0.1
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f package.json ]; then
            echo "package.json not found" >&2
            exit 1
          fi

          sudo apt-get update && sudo apt-get install -y jq || true

          # Ensure devDependencies.typescript is 4.9.5
          if command -v jq >/dev/null 2>&1; then
            tmp=$(mktemp)
            # Add devDependencies if missing
            if ! jq -e '.devDependencies' package.json >/dev/null; then
              jq '. + {devDependencies:{}}' package.json > "$tmp" && mv "$tmp" package.json
            fi
            # Set TypeScript to 4.9.5
            tmp=$(mktemp)
            jq '.devDependencies.typescript = "4.9.5"' package.json > "$tmp" && mv "$tmp" package.json
          else
            # Fallback sed: if devDependencies exists, replace typescript line or add it
            if grep -q '"devDependencies"' package.json; then
              if grep -q '"typescript"' package.json; then
                sed -i 's/"typescript": "[^"]*"/"typescript": "4.9.5"/' package.json
              else
                sed -i 's/"devDependencies": {/"devDependencies": {\\n    "typescript": "4.9.5",/' package.json
              fi
            else
              sed -i 's/}$/,\n  "devDependencies": {\n    "typescript": "4.9.5"\n  }\n}/' package.json
            fi
          fi

          # Ensure react-scripts at dependencies
          if command -v jq >/dev/null 2>&1; then
            tmp=$(mktemp)
            jq '.dependencies["react-scripts"] = "5.0.1"' package.json > "$tmp" && mv "$tmp" package.json
          else
            if grep -q '"dependencies"' package.json; then
              if grep -q '"react-scripts"' package.json; then
                sed -i 's/"react-scripts": "[^"]*"/"react-scripts": "5.0.1"/' package.json
              else
                sed -i 's/"dependencies": {/"dependencies": {\\n    "react-scripts": "5.0.1",/' package.json
              fi
            else
              sed -i 's/^{/{\n  "dependencies": {\n    "react-scripts": "5.0.1"\n  },/' package.json
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Commit package.json changes (if any)
        shell: bash
        run: |
          set -euxo pipefail
          if ! git diff --quiet package.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add package.json
            git commit -m "Pin TypeScript to 4.9.5 and ensure react-scripts 5.0.1"
            git push origin "${{ github.event.inputs.target_branch }}"
