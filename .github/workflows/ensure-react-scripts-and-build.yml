name: Ensure react-scripts installed and build CRA (resolve TS peer deps)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to fix and build'
        default: 'react-migration-cra-ts'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Pin TypeScript to 4.9.5 and ensure react-scripts 5.0.1
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f package.json ]; then
            echo "package.json not found" >&2
            exit 1
          fi

          # Show current TS version
          node -e "try{const p=require('./package.json');console.log('Current TS:',p.devDependencies?.typescript||p.dependencies?.typescript||'none')}catch(e){console.log('No package.json parsed')}" || true

          # Remove any existing TypeScript to avoid dual versions
          npm uninstall typescript || true

          # Install TS 4.9.5 as devDependency (CRA 5 peer range ^3.2.1 || ^4)
          npm install --save-dev typescript@4.9.5

          # Ensure react-scripts 5.0.1 in dependencies
          # Use legacy peer deps to avoid resolution conflicts with existing lint deps
          npm install --save react-scripts@5.0.1 --legacy-peer-deps

      - name: Commit package.json changes (if any)
        shell: bash
        run: |
          set -euxo pipefail
          if ! git diff --quiet package.json package-lock.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add package.json package-lock.json
            git commit -m "Pin TypeScript to 4.9.5 and add react-scripts@5.0.1 (legacy peer deps)"
            git push origin "${{ github.event.inputs.target_branch }}"
          else
            echo "No changes to commit."
          fi

      - name: Clean install with legacy peer deps
        shell: bash
        run: |
          set -euxo pipefail
          # Prefer clean install; fall back to install with legacy peer deps for consistency
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build CRA
        run: npm run build
