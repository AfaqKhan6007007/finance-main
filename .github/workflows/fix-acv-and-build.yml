name: Pin Ajv v8 and ajv-keywords v5, then build CRA

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to fix and build'
        default: 'react-migration-cra-ts'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Pin Ajv and ajv-keywords to compatible versions
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f package.json ]; then
            echo "package.json not found" >&2
            exit 1
          fi

          # Install Ajv v8 and ajv-keywords v5 to satisfy schema-utils/webpack plugins
          npm install --save-dev ajv@^8.12.0 ajv-keywords@^5.1.0

          # Ensure react-scripts 5.0.1 present and TS pinned to 4.9.5
          npm install --save react-scripts@5.0.1 --legacy-peer-deps
          npm install --save-dev typescript@4.9.5

      - name: Commit dependency pins (if any)
        shell: bash
        run: |
          set -euxo pipefail
          if ! git diff --quiet package.json package-lock.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add package.json package-lock.json
            git commit -m "Pin Ajv v8 and ajv-keywords v5; ensure react-scripts@5.0.1 and TypeScript@4.9.5"
            git push origin "${{ github.event.inputs.target_branch }}"
          else
            echo "No changes to commit."
          fi

      - name: Clean install with legacy peer deps
        shell: bash
        run: |
          set -euxo pipefail
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build CRA
        run: npm run build
