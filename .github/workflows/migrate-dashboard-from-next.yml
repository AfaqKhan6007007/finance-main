name: Migrate Dashboard from Next.js into CRA (robust)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update'
        default: 'react-migration-cra-ts'
        required: true
        type: string
      dashboard_hint_path:
        description: 'Optional hint path (e.g., pages/dashboard.tsx or app/dashboard/page.tsx)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  migrate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: List repository files for debugging
        shell: bash
        run: |
          set -euxo pipefail
          echo "Workspace: $PWD"
          echo "Top-level files:"
          ls -la
          echo "Known Next-like dirs if present:"
          for d in pages src/pages app src/app; do
            if [ -d "$d" ]; then
              echo "Contents of $d:"
              ls -la "$d" || true
            fi
          done

      - name: Find Dashboard source in Next.js code
        id: find_dashboard
        shell: bash
        run: |
          set -euxo pipefail
          HINT="${{ github.event.inputs.dashboard_hint_path }}"
          FOUND=""

          echo "User-provided hint: '${HINT}'"
          if [ -n "$HINT" ] && [ -f "$HINT" ]; then
            FOUND="$HINT"
            echo "Using user-provided path: $FOUND"
          else
            echo "Hint not provided or not a file; scanning common locations..."
            for candidate in \
              "pages/dashboard.tsx" \
              "pages/dashboard.jsx" \
              "pages/dashboard.js" \
              "src/pages/dashboard.tsx" \
              "src/pages/dashboard.jsx" \
              "src/pages/dashboard.js" \
              "app/dashboard/page.tsx" \
              "app/dashboard/page.jsx" \
              "app/dashboard/page.js" \
              "src/app/dashboard/page.tsx" \
              "src/app/dashboard/page.jsx" \
              "src/app/dashboard/page.js"
            do
              if [ -f "$candidate" ]; then
                FOUND="$candidate"
                echo "Found candidate: $FOUND"
                break
              fi
            done

            if [ -z "$FOUND" ]; then
              echo "No common location found; grepping tracked files..."
              FOUND="$(git ls-files | grep -E '(^|/)dashboard\.(tsx|jsx|js)$' | head -n1 || true)"
              if [ -n "$FOUND" ]; then
                echo "Found by grep: $FOUND"
              fi
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: No Dashboard source file found. Provide dashboard_hint_path (e.g., app/dashboard/page.tsx)." >&2
            exit 1
          fi

          echo "found_path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Selected Dashboard source: $FOUND"

      - name: Prepare destination directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p src/pages src/routes

      - name: Copy Dashboard to CRA and adapt imports
        shell: bash
        run: |
          set -euxo pipefail
          SRC="${{ steps.find_dashboard.outputs.found_path }}"
          DEST="src/pages/Dashboard.tsx"

          echo "Copying '$SRC' -> '$DEST'"
          cp "$SRC" "$DEST"

          echo "Adapting imports in '$DEST' (next/head, next/image, next/link -> react-router-dom)"
          # Remove next/head import
          sed -i "s/^\\s*import .* from 'next\\/head';\\s*$//g" "$DEST" || true
          # Remove next/image import and convert tag name; actual props remain (safe for now)
          sed -i "s/^\\s*import .* from 'next\\/image';\\s*$//g" "$DEST" || true
          sed -i 's/<Image/<img/g' "$DEST" || true
          # Replace next/link import with react-router-dom
          sed -i "s/from 'next\\/link'/from 'react-router-dom'/g" "$DEST" || true
          # Convert JSX Link href to to
          sed -i 's/<Link\\([^>]*\\)href=/<Link\\1to=/g' "$DEST" || true
          # Remove simple inline <Head>...</Head> blocks if present (non-greedy)
          perl -0777 -pe "s/<Head>.*?<\\/Head>//gs" -i "$DEST" || true

          echo "Ensuring default export exists"
          if ! grep -q 'export default' "$DEST"; then
            NAME=$(grep -E 'export (const|function|class) ' "$DEST" | head -n1 | sed -E 's/export (const|function|class) ([A-Za-z0-9_]+).*/\2/' || true)
            if [ -n "$NAME" ]; then
              printf '\nexport default %s;\n' "$NAME" >> "$DEST"
            else
              # Wrap content minimally
              printf '%s\n' "import React from 'react';" \
                "export default function Dashboard() {" \
                "  return <main style={{ padding: '1rem' }}><h1>Dashboard</h1></main>;" \
                "}" > "$DEST"
            fi
          fi

      - name: Wire Dashboard into routes
        shell: bash
        run: |
          set -euxo pipefail
          printf '%s\n' \
            "import React from 'react';" \
            "import Home from '../pages/Home';" \
            "import Dashboard from '../pages/Dashboard';" \
            "" \
            "export type AppRoute = { path: string; element: React.ReactElement };" \
            "" \
            "export const routes: AppRoute[] = [" \
            "  { path: '/', element: <Home /> }," \
            "  { path: '/dashboard', element: <Dashboard /> }," \
            "];" > src/routes/index.tsx

      - name: Update App.tsx navigation
        shell: bash
        run: |
          set -euxo pipefail
          printf '%s\n' \
            "import React from 'react';" \
            "import { BrowserRouter, Routes, Route, Link } from 'react-router-dom';" \
            "import { routes } from './routes';" \
            "" \
            "export default function App() {" \
            "  const links = [" \
            "    { to: '/', label: 'Home' }," \
            "    { to: '/dashboard', label: 'Dashboard' }," \
            "  ];" \
            "" \
            "  return (" \
            "    <BrowserRouter>" \
            "      <nav style={{ padding: '0.5rem', display: 'flex', gap: '0.75rem' }}>" \
            "        {links.map((l) => (" \
            "          <Link key={l.to} to={l.to}>{l.label}</Link>" \
            "        ))}" \
            "      </nav>" \
            "      <Routes>" \
            "        {routes.map((r) => (" \
            "          <Route key={r.path} path={r.path} element={r.element} />" \
            "        ))}" \
            "      </Routes>" \
            "    </BrowserRouter>" \
            "  );" \
            "}" > src/App.tsx

      - name: Commit Dashboard migration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/pages/Dashboard.tsx src/routes/index.tsx src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit." && exit 0
          fi
          git commit -m "Migrate Dashboard from Next.js into CRA (imports adapted, routes wired)"
          git push origin "${{ github.event.inputs.target_branch }}"
