name: Migrate Dashboard from Next.js into CRA (src/app support, escaped paths)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update (destination CRA branch)'
        default: 'react-migration-cra-ts'
        required: true
        type: string
      source_branch:
        description: 'Branch where the Next.js Dashboard source exists (defaults to target_branch)'
        required: false
        type: string
      dashboard_hint_path:
        description: 'Exact path to the Dashboard source (e.g., src/app/(pages)/user/dashboard/page.tsx)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  migrate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branches
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          TB="${{ github.event.inputs.target_branch }}"
          SB="${{ github.event.inputs.source_branch }}"
          if [ -z "${SB}" ]; then SB="${TB}"; fi
          echo "target_branch=$TB" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SB" >> "$GITHUB_OUTPUT"

      - name: Check out target branch (destination)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target_branch }}
          path: dest

      - name: Check out source branch (where Next Dashboard lives)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.source_branch }}
          path: src_repo

      - name: Debug list common Next dirs in source
        shell: bash
        run: |
          set -euxo pipefail
          cd src_repo
          echo "Workspace (source): $PWD"
          # Explicitly quote/escape parentheses to avoid shell interpretation
          for d in "src/app" "src/app/(pages)" "src/app/(pages)/user" "src/pages" "app" "pages"; do
            if [ -d "$d" ]; then
              echo "Contents of $d:"
              ls -la "$d" || true
            fi
          done

      - name: Locate Dashboard source (supports src/app with parentheses)
        id: find_dashboard
        shell: bash
        run: |
          set -euo pipefail
          cd src_repo

          HINT="${{ github.event.inputs.dashboard_hint_path }}"
          FOUND=""

          # Use explicit hint if provided and exists
          if [ -n "$HINT" ] && [ -f "$HINT" ]; then
            FOUND="$HINT"
          fi

          # Try src/app/(pages)/user/dashboard first
          if [ -z "$FOUND" ]; then
            for candidate in \
              "src/app/(pages)/user/dashboard/page.tsx" \
              "src/app/(pages)/user/dashboard/page.jsx" \
              "src/app/(pages)/user/dashboard/page.js" \
              "src/app/(pages)/user/dashboard/index.tsx" \
              "src/app/(pages)/user/dashboard/index.jsx" \
              "src/app/(pages)/user/dashboard/index.js"
            do
              if [ -f "$candidate" ]; then
                FOUND="$candidate"
                break
              fi
            done
          fi

          # Other common src/app locations
          if [ -z "$FOUND" ]; then
            for candidate in \
              "src/app/dashboard/page.tsx" \
              "src/app/dashboard/page.jsx" \
              "src/app/dashboard/page.js" \
              "src/app/dashboard/index.tsx" \
              "src/app/dashboard/index.jsx" \
              "src/app/dashboard/index.js"
            do
              if [ -f "$candidate" ]; then
                FOUND="$candidate"
                break
              fi
            done
          fi

          # Legacy pages/ paths
          if [ -z "$FOUND" ]; then
            for candidate in \
              "src/pages/dashboard.tsx" \
              "src/pages/dashboard.jsx" \
              "src/pages/dashboard.js" \
              "pages/dashboard.tsx" \
              "pages/dashboard.jsx" \
              "pages/dashboard.js" \
              "app/(pages)/user/dashboard/page.tsx" \
              "app/(pages)/user/dashboard/page.jsx" \
              "app/(pages)/user/dashboard/page.js" \
              "app/dashboard/page.tsx" \
              "app/dashboard/page.jsx" \
              "app/dashboard/page.js"
            do
              if [ -f "$candidate" ]; then
                FOUND="$candidate"
                break
              fi
            done
          fi

          # Grep fallback (escape parentheses)
          if [ -z "$FOUND" ]; then
            FOUND="$(git ls-files | grep -E '(^|/)(app|src/app|pages|src/pages)/.*(dashboard|user\\/dashboard)/(page|index)\\.(tsx|jsx|js)$' | head -n1 || true)"
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: Dashboard source not found. Provide dashboard_hint_path like src/app/(pages)/user/dashboard/page.tsx" >&2
            exit 1
          fi

          echo "Found Dashboard at: $FOUND"
          echo "found_path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Copy and adapt Dashboard to CRA
        shell: bash
        run: |
          set -euo pipefail
          SRC_PATH="${{ steps.find_dashboard.outputs.found_path }}"
          echo "Source file: $SRC_PATH"

          mkdir -p dest/src/pages dest/src/routes

          # Copy to CRA pages as Dashboard.tsx
          cp "src_repo/$SRC_PATH" "dest/src/pages/Dashboard.tsx"

          FILE="dest/src/pages/Dashboard.tsx"

          # Adapt imports: next/head, next/image, next/link
          sed -i "s/^\\s*import .* from 'next\\/head';\\s*$//g" "$FILE" || true
          sed -i "s/^\\s*import .* from 'next\\/image';\\s*$//g" "$FILE" || true
          sed -i "s/from 'next\\/link'/from 'react-router-dom'/g" "$FILE" || true

          # Convert JSX Link href to to
          sed -i 's/<Link\\([^>]*\\)href=/<Link\\1to=/g' "$FILE" || true

          # Convert Next Image tag name to img (basic heuristic)
          sed -i 's/<Image/<img/g' "$FILE" || true

          # Remove simple <Head>...</Head> blocks (non-greedy)
          perl -0777 -pe "s/<Head>.*?<\\/Head>//gs" -i "$FILE" || true

          # If this is a server component (uses React hooks), ensure client component directive
          if grep -Eq 'useState|useEffect|useMemo|useCallback' "$FILE"; then
            if ! grep -q "^['\"]use client['\"]" "$FILE"; then
              TMP="$(mktemp)"
              printf '%s\n' "/* Converted from Next app route to client component */" "'use client';" > "$TMP"
              cat "$FILE" >> "$TMP"
              mv "$TMP" "$FILE"
            fi
          fi

          # Ensure default export exists
          if ! grep -q 'export default' "$FILE"; then
            NAME=$(grep -E 'export (const|function|class) ' "$FILE" | head -n1 | sed -E 's/export (const|function|class) ([A-Za-z0-9_]+).*/\2/' || true)
            if [ -n "$NAME" ]; then
              printf '\nexport default %s;\n' "$NAME" >> "$FILE"
            else
              printf '%s\n' "import React from 'react';" \
                "export default function Dashboard() {" \
                "  return <main style={{ padding: '1rem' }}><h1>Dashboard</h1></main>;" \
                "}" > "$FILE"
            fi
          fi

      - name: Wire Dashboard route and nav in CRA
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "import React from 'react';" \
            "import Home from '../pages/Home';" \
            "import Dashboard from '../pages/Dashboard';" \
            "" \
            "export type AppRoute = { path: string; element: React.ReactElement };" \
            "" \
            "export const routes: AppRoute[] = [" \
            "  { path: '/', element: <Home /> }," \
            "  { path: '/dashboard', element: <Dashboard /> }," \
            "];" > dest/src/routes/index.tsx

          printf '%s\n' \
            "import React from 'react';" \
            "import { BrowserRouter, Routes, Route, Link } from 'react-router-dom';" \
            "import { routes } from './routes';" \
            "" \
            "export default function App() {" \
            "  const links = [" \
            "    { to: '/', label: 'Home' }," \
            "    { to: '/dashboard', label: 'Dashboard' }," \
            "  ];" \
            "" \
            "  return (" \
            "    <BrowserRouter>" \
            "      <nav style={{ padding: '0.5rem', display: 'flex', gap: '0.75rem' }}>" \
            "        {links.map((l) => (" \
            "          <Link key={l.to} to={l.to}>{l.label}</Link>" \
            "        ))}" \
            "      </nav>" \
            "      <Routes>" \
            "        {routes.map((r) => (" \
            "          <Route key={r.path} path={r.path} element={r.element} />" \
            "        ))}" \
            "      </Routes>" \
            "    </BrowserRouter>" \
            "  );" \
            "}" > dest/src/App.tsx

      - name: Commit Dashboard migration to target branch
        shell: bash
        run: |
          set -euo pipefail
          cd dest
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/pages/Dashboard.tsx src/routes/index.tsx src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Migrate Dashboard from Next.js (supports src/app paths with parentheses) into CRA and wire routes/nav"
            git push origin "${{ steps.resolve.outputs.target_branch }}"
          fi
